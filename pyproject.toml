[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alzheimer-fl-cv"
version = "0.1.0"
description = "Data pipeline for four-class Alzheimer MRI federated learning"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12",
  "Pillow>=9.5",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "torchvision>=0.16",
  "flwr[simulation]>=1.28.0,<2.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.flwr.app]
publisher = "cv-fl-project"
fab-include = ["configs/*.yaml"]

[tool.flwr.app.components]
serverapp = "src.federated.server_app:app"
clientapp = "src.federated.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 20
local-epochs = 1
