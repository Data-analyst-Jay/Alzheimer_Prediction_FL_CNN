# Federated training settings
federated:
  rounds: 20
  clients: 4
  client_epochs: 1
  fedprox_mu: 0.01
  backbone_learning_rate: 0.00001
  classifier_learning_rate: 0.0001
  weight_decay: 0.0001
  classifier_hidden_units: 256
  dropout: 0.3
  seed: 42
  warmstart_checkpoint: warmstart_densenet121_best.pt
